<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PortGuard · 端口态势感知</title>
<link rel="icon" href="images/icon_64.png">
<style>
:root{
  --bg:#06080b;
  --bg-soft:#0a0e13;
  --panel:rgba(255,255,255,.022);
  --panel-2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.075);
  --line-soft:rgba(255,255,255,.045);
  --text:#e8eef6;
  --muted:#8b98a7;
  --dim:#6b7785;
  --accent:#37e0d0;
  --accent-2:#5b9dff;
  --high:#ff5c6c;
  --mid:#ffb84d;
  --low:#35d6a4;
  --violet:#b07cff;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:13px;line-height:1.5;min-height:100vh;
  background-image:
    radial-gradient(900px 420px at 12% -8%,rgba(55,224,208,.10),transparent 62%),
    radial-gradient(760px 380px at 92% -12%,rgba(91,157,255,.09),transparent 60%),
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:auto,auto,56px 56px,56px 56px;
  background-attachment:fixed;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------------- shell ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;
  gap:18px;padding:0 26px;border-bottom:1px solid var(--line);
  background:rgba(6,8,11,.82);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{display:block;flex:none}
.brand .name{font-family:var(--mono);font-size:13px;letter-spacing:.22em;font-weight:600}
.brand .sub{color:var(--dim);font-size:11px;letter-spacing:.08em;border-left:1px solid var(--line);padding-left:11px}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--low);box-shadow:0 0 0 3px rgba(53,214,164,.12)}
.dot.warn{background:var(--mid);box-shadow:0 0 0 3px rgba(255,184,77,.12)}
.dot.err{background:var(--high);box-shadow:0 0 0 3px rgba(255,92,108,.12)}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{
  height:30px;padding:0 11px;border:1px solid var(--line);border-radius:7px;
  color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px;
  background:var(--panel);transition:.16s;
}
.iconbtn:hover{color:var(--text);border-color:rgba(55,224,208,.35);background:rgba(55,224,208,.06)}
.iconbtn svg{opacity:.8}

.wrap{max-width:1480px;margin:0 auto;padding:22px 26px 60px}

/* ---------------- kpi ---------------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{
  position:relative;border:1px solid var(--line);border-radius:11px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  padding:15px 16px 13px;overflow:hidden;
}
.kpi:after{
  content:"";position:absolute;left:0;top:0;width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(55,224,208,.55),transparent);
  opacity:.55;
}
.kpi .lab{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.kpi .val{font-family:var(--mono);font-size:31px;font-weight:600;line-height:1.15;margin-top:5px}
.kpi .meta{color:var(--dim);font-size:11px;margin-top:2px}
.kpi .bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:11px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:2px;background:var(--accent);width:0;transition:width .5s ease}
.kpi.high .val{color:var(--high)}
.kpi.high .bar i{background:var(--high)}
.kpi.idle .val{color:var(--mid)}
.kpi.idle .bar i{background:var(--mid)}
.kpi.abn .val{color:var(--violet)}
.kpi.abn .bar i{background:var(--violet)}

/* ---------------- toolbar ---------------- */
.panel{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 13px;border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.012);
}
.tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px;background:rgba(0,0,0,.25)}
.tab{padding:5px 12px;border-radius:6px;color:var(--muted);font-size:12px;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{background:rgba(55,224,208,.11);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(55,224,208,.22)}
.search{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;
  border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.22);min-width:190px;
}
.search input{background:none;border:none;outline:none;width:100%;font-size:12px}
.search input::placeholder{color:var(--dim)}
.search svg{opacity:.45;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:26px;padding:0 10px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.chip.on{color:var(--text);border-color:rgba(55,224,208,.4);background:rgba(55,224,208,.07)}
.chip b{font-family:var(--mono);font-weight:600;color:var(--dim)}
.chip.on b{color:var(--accent)}

/* ---------------- table ---------------- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:2;text-align:left;font-weight:500;color:var(--dim);
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 14px;background:#080b0f;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.028)}
tbody tr:last-child td{border-bottom:none}
.port{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em}
.proto{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.svc{display:flex;flex-direction:column;gap:1px;min-width:120px}
.svc .n{color:var(--text)}
.svc .d{color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.owner{display:flex;flex-direction:column;gap:1px}
.owner .k{font-size:10px;color:var(--dim);letter-spacing:.05em}
.owner .v{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.v6{color:#ff9aa4;border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.07)}
.tag.any{color:#ffcf8a;border-color:rgba(255,184,77,.3);background:rgba(255,184,77,.06)}
.tag.lo{color:var(--low);border-color:rgba(53,214,164,.28);background:rgba(53,214,164,.06)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.state i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.state.s-active i{background:var(--low);box-shadow:0 0 6px rgba(53,214,164,.7)}
.state.s-idle i{background:var(--mid)}
.state.s-orphan i{background:var(--violet);box-shadow:0 0 6px rgba(176,124,255,.6)}
.state.s-kernel i{background:var(--accent-2)}
.state.s-ghost i{background:#8a93a0;border:1px solid #8a93a0;background:none}
.state.s-fresh i{background:#8ad0ff}
.usage{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.usage b{color:var(--text);font-weight:500}
.usage .ext{color:var(--dim)}
.risk{display:flex;align-items:center;gap:9px;min-width:92px}
.risk .n{font-family:var(--mono);font-size:12.5px;width:26px;text-align:right}
.risk .track{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.risk .track i{display:block;height:100%;border-radius:3px}
.risk.r-high .n{color:var(--high)}
.risk.r-high .track i{background:var(--high)}
.risk.r-mid .n{color:var(--mid)}
.risk.r-mid .track i{background:var(--mid)}
.risk.r-low .n{color:var(--low)}
.risk.r-low .track i{background:var(--low)}
.mini{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.mini span{font-size:9.5px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;
  border:1px solid var(--line);color:var(--dim)}
.mini span.w{color:var(--violet);border-color:rgba(176,124,255,.3)}
.mini span.h{color:var(--high);border-color:rgba(255,92,108,.3)}

/* ---------------- apps view ---------------- */
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px}
.appcard{border:1px solid var(--line);border-radius:9px;padding:13px 14px;background:rgba(255,255,255,.02)}
.appcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.appcard .t{font-size:13px;font-weight:500}
.appcard .s{font-size:10.5px;color:var(--dim);margin-top:2px}
.appcard .ports{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.appcard .ports span{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted)}
.appcard .ports span.hi{color:var(--high);border-color:rgba(255,92,108,.32)}
.appcard .ports span.mi{color:var(--mid);border-color:rgba(255,184,77,.28)}

/* ---------------- conflict / timeline ---------------- */
.list{padding:6px 0}
.item{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.item:last-child{border-bottom:none}
.item .lv{font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);flex:none;margin-top:1px}
.item .lv.high{color:var(--high);border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.07)}
.item .lv.mid{color:var(--mid);border-color:rgba(255,184,77,.3);background:rgba(255,184,77,.06)}
.item .lv.info{color:var(--accent-2);border-color:rgba(91,157,255,.3);background:rgba(91,157,255,.06)}
.item .body{flex:1;min-width:0}
.item .body .t{font-size:12.5px}
.item .body .d{color:var(--dim);font-size:11px;margin-top:2px}
.item .ts{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none;margin-top:2px}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(540px,94vw);z-index:51;
  background:#090d12;border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer .head{padding:18px 20px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer .head .p{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.drawer .head .meta{color:var(--muted);font-size:11.5px;margin-top:5px}
.drawer .body{overflow-y:auto;padding:16px 20px 40px;flex:1}
.sec{margin-bottom:20px}
.sec .h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 12px;font-size:12px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;word-break:break-all}
.kv dd.mono{font-size:11.5px;color:#cfd8e3}
.note{color:var(--muted);font-size:12px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11px;
  border:1px solid var(--line);color:var(--muted)}
.pill.high{color:var(--high);border-color:rgba(255,92,108,.35);background:rgba(255,92,108,.07)}
.pill.mid{color:var(--mid);border-color:rgba(255,184,77,.3);background:rgba(255,184,77,.06)}
.pill.low{color:var(--low);border-color:rgba(53,214,164,.28);background:rgba(53,214,164,.06)}
.actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn{height:31px;padding:0 12px;border-radius:7px;border:1px solid var(--line);
  color:var(--muted);font-size:12px;background:rgba(255,255,255,.02);transition:.15s}
.btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.btn.primary{color:#04110f;background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}

/* ---------------- gate ---------------- */
.gate{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(700px 400px at 50% 0%,rgba(55,224,208,.09),transparent 60%),var(--bg)}
.gate .card{width:min(380px,90vw);border:1px solid var(--line);border-radius:14px;padding:28px 26px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));text-align:center}
.gate h1{font-family:var(--mono);font-size:15px;letter-spacing:.26em;margin:14px 0 4px;font-weight:600}
.gate p{color:var(--dim);font-size:11.5px;margin:0 0 20px}
.gate input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);
  padding:0 12px;outline:none;font-size:13px;text-align:center;letter-spacing:.2em}
.gate input:focus{border-color:rgba(55,224,208,.45)}
.gate .btn.primary{width:100%;height:38px;margin-top:10px;border-radius:8px}
.gate .err{color:var(--high);font-size:11.5px;margin-top:10px;min-height:16px}

.empty{padding:52px 20px;text-align:center;color:var(--dim);font-size:12px}
.empty .big{font-family:var(--mono);font-size:26px;color:#1e2833;letter-spacing:.2em;margin-bottom:8px}
.foot{margin-top:14px;display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#0d131a;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:8px;
  font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------------- confirm modal ---------------- */
.modal{position:fixed;inset:0;z-index:96;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.58);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.16s}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{width:min(408px,92vw);background:#0b1016;border:1px solid var(--line);
  border-radius:12px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal h3{margin:0 0 7px;font-size:14px;font-weight:600}
.modal p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn.danger{color:#fff;background:#d94456;border-color:#d94456}
.btn.danger:hover{filter:brightness(1.07)}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  .wrap{padding:16px 14px 50px}
  .topbar{padding:0 14px;gap:10px}
  .brand .sub{display:none}
  .col-bind,.col-use{display:none}
  .kpi .val{font-size:25px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <rect x="1.2" y="1.2" width="19.6" height="19.6" rx="5" stroke="#37e0d0" stroke-opacity=".55" stroke-width="1.1"/>
      <circle cx="7.4" cy="7.4" r="1.7" fill="#37e0d0"/>
      <circle cx="14.6" cy="7.4" r="1.7" fill="#37e0d0" fill-opacity=".25"/>
      <circle cx="7.4" cy="14.6" r="1.7" fill="#37e0d0" fill-opacity=".25"/>
      <circle cx="14.6" cy="14.6" r="1.7" fill="#ff5c6c"/>
    </svg>
    <div>
      <div class="name">PORTGUARD</div>
    </div>
    <div class="sub">端口态势感知</div>
  </div>
  <div class="spacer"></div>
  <div class="status">
    <span class="dot" id="scan-dot"></span>
    <span id="scan-text">连接中</span>
  </div>
  <button class="iconbtn" id="btn-refresh">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>刷新
  </button>
  <button class="iconbtn" id="btn-export">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>报告
  </button>
  <button class="iconbtn" id="btn-logout">退出</button>
</div>

<div class="wrap">
  <div class="kpis">
    <div class="kpi">
      <div class="lab">监听端口</div>
      <div class="val mono" id="k-total">–</div>
      <div class="meta" id="k-total-meta">等待首次采集</div>
      <div class="bar"><i id="k-total-bar"></i></div>
    </div>
    <div class="kpi high">
      <div class="lab">高风险</div>
      <div class="val mono" id="k-high">–</div>
      <div class="meta" id="k-high-meta">暴露面评分 ≥ 70</div>
      <div class="bar"><i id="k-high-bar"></i></div>
    </div>
    <div class="kpi idle">
      <div class="lab">闲置 / 无流量</div>
      <div class="val mono" id="k-idle">–</div>
      <div class="meta">开着但窗口内无访问</div>
      <div class="bar"><i id="k-idle-bar"></i></div>
    </div>
    <div class="kpi abn">
      <div class="lab">异常</div>
      <div class="val mono" id="k-abn">–</div>
      <div class="meta" id="k-abn-meta">僵尸 / 幽灵 / 冲突</div>
      <div class="bar"><i id="k-abn-bar"></i></div>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab on" data-view="matrix">端口矩阵</button>
        <button class="tab" data-view="apps">应用视图</button>
        <button class="tab" data-view="conflicts">冲突</button>
        <button class="tab" data-view="timeline">时间线</button>
      </div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索端口 / 服务 / 应用 / 路径">
      </div>
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">全部 <b id="c-all">0</b></button>
        <button class="chip" data-f="active">活跃 <b id="c-active">0</b></button>
        <button class="chip" data-f="idle">闲置 <b id="c-idle">0</b></button>
        <button class="chip" data-f="abnormal">异常 <b id="c-abn">0</b></button>
        <button class="chip" data-f="high">高危 <b id="c-high">0</b></button>
      </div>
      <div class="spacer"></div>
      <select class="iconbtn" id="sort" style="padding:0 8px">
        <option value="risk">按风险</option>
        <option value="port">按端口</option>
        <option value="state">按状态</option>
      </select>
    </div>
    <div id="view"></div>
  </div>

  <div class="foot">
    <div id="foot-left">PortGuard · 只读采集，不修改任何系统配置</div>
    <div id="foot-right" class="mono">–</div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="head">
    <div style="flex:1">
      <div class="p mono" id="d-port">3306</div>
      <div class="meta" id="d-meta">–</div>
    </div>
    <button class="iconbtn" id="d-close">关闭</button>
  </div>
  <div class="body" id="d-body"></div>
</aside>

<div class="gate hidden" id="gate">
  <div class="card">
    <svg width="34" height="34" viewBox="0 0 22 22" fill="none">
      <rect x="1.2" y="1.2" width="19.6" height="19.6" rx="5" stroke="#37e0d0" stroke-opacity=".55" stroke-width="1.1"/>
      <circle cx="7.4" cy="7.4" r="1.7" fill="#37e0d0"/>
      <circle cx="14.6" cy="7.4" r="1.7" fill="#37e0d0" fill-opacity=".25"/>
      <circle cx="7.4" cy="14.6" r="1.7" fill="#37e0d0" fill-opacity=".25"/>
      <circle cx="14.6" cy="14.6" r="1.7" fill="#ff5c6c"/>
    </svg>
    <h1 id="gate-title">PORTGUARD</h1>
    <p id="gate-sub">输入访问口令</p>
    <input id="gate-pwd" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn primary" id="gate-btn">进入</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="m-title">确认操作</h3>
    <p id="m-text"></p>
    <div class="row">
      <button class="btn" id="m-cancel">取消</button>
      <button class="btn danger" id="m-ok">确认</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var S = { data:null, view:"matrix", filter:"all", q:"", sort:"risk", timer:null, needsSetup:false };
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return "–";
    var d = new Date(ts*1000);
    function p(n){ return n<10 ? "0"+n : ""+n; }
    return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  function toast(msg){
    var el = $("toast"); el.textContent = msg; el.classList.add("on");
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 2200);
  }
  function api(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["X-Requested-With"] = "portguard";
    if(opts.body && !opts.headers["Content-Type"]){
      opts.headers["Content-Type"] = "application/json";
    }
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){ var e = new Error(j.error || ("HTTP "+r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  /* -------------------------------- gate -------------------------------- */
  function showGate(setup){
    S.needsSetup = !!setup;
    $("gate").classList.remove("hidden");
    $("gate-title").textContent = setup ? "首次初始化" : "PORTGUARD";
    $("gate-sub").textContent = setup ? "设置访问口令（至少 8 位）" : "输入访问口令";
    $("gate-btn").textContent = setup ? "设置并进入" : "进入";
    $("gate-pwd").value = "";
    setTimeout(function(){ $("gate-pwd").focus(); }, 50);
  }
  function hideGate(){ $("gate").classList.add("hidden"); }

  function doGate(){
    var pwd = $("gate-pwd").value;
    var url = S.needsSetup ? "api/setup" : "api/login";
    $("gate-err").textContent = "";
    api(url, { method:"POST", body: JSON.stringify({password: pwd}) })
      .then(function(){ hideGate(); boot(); })
      .catch(function(e){ $("gate-err").textContent = e.message || "失败"; });
  }
  $("gate-btn").addEventListener("click", doGate);
  $("gate-pwd").addEventListener("keydown", function(e){ if(e.key === "Enter") doGate(); });

  /* -------------------------------- render -------------------------------- */
  function visible(rows){
    var q = S.q.trim().toLowerCase();
    return rows.filter(function(r){
      if(S.filter === "active" && !(r.state === "ACTIVE" || r.state === "WARM")) return false;
      if(S.filter === "idle" && r.state !== "IDLE") return false;
      if(S.filter === "high" && r.risk_level !== "high") return false;
      if(S.filter === "abnormal"){
        var bad = (r.state === "ORPHAN" || r.state === "GHOST" || r.state === "GHOST_SOFT");
        if(!bad){ bad = (r.conflicts || []).some(function(c){ return c.level === "high"; }); }
        if(!bad) return false;
      }
      if(!q) return true;
      var hay = [r.port, r.proto, r.service, r.app, r.app_label, r.comm, r.exe,
                 r.cmdline, (r.addrs||[]).join(" "), r.container].join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }

  function sorted(rows){
    var arr = rows.slice();
    if(S.sort === "port") arr.sort(function(a,b){ return a.port - b.port || a.proto.localeCompare(b.proto); });
    else if(S.sort === "state") arr.sort(function(a,b){ return (a.state||"").localeCompare(b.state||"") || a.port-b.port; });
    else arr.sort(function(a,b){ return b.risk - a.risk || a.port - b.port; });
    return arr;
  }

  function riskHtml(r){
    var cls = r.risk_level === "high" ? "r-high" : (r.risk_level === "mid" ? "r-mid" : "r-low");
    return '<div class="risk '+cls+'"><span class="n mono">'+r.risk+'</span>'+
           '<span class="track"><i style="width:'+Math.max(4, r.risk)+'%"></i></span></div>';
  }
  function stateHtml(r){
    var cls = "s-" + (r.state || "").toLowerCase();
    return '<span class="state '+cls+'"><i></i>'+esc(r.state_label)+'</span>';
  }
  function expHtml(r){
    if(r.exposure === "public_v6") return '<span class="tag v6">公网 v6</span>';
    if(r.exposure === "any") return '<span class="tag any">全网卡</span>';
    if(r.exposure === "loopback") return '<span class="tag lo">仅本机</span>';
    if(r.exposure === "none") return '<span class="tag">无监听</span>';
    return '<span class="tag">指定地址</span>';
  }
  function usageHtml(r){
    if(r.state === "GHOST" || r.state === "GHOST_SOFT") return '<span class="usage ext">—</span>';
    var s = '<span class="usage">内 <b>'+r.conns_in+'</b> / 外 <b>'+r.conns_out+'</b>';
    if(r.ext_packets > 0) s += ' <span class="ext">· '+r.ext_packets+' 包</span>';
    return s + '</span>';
  }
  function miniHtml(r){
    var out = [];
    (r.conflicts||[]).forEach(function(c){
      var cls = c.level === "high" ? "h" : (c.code === "SHARED" || c.code === "DUAL_PROTO" ? "" : "w");
      out.push('<span class="'+cls+'">'+esc(c.code)+'</span>');
    });
    if(r.accepted) out.push('<span>已接受</span>');
    return out.length ? '<div class="mini">'+out.join("")+'</div>' : "";
  }

  function renderMatrix(rows){
    if(!rows.length){
      return '<div class="empty"><div class="big">NO DATA</div>没有符合条件的端口</div>';
    }
    var h = '<div class="tablewrap"><table><thead><tr>'+
      '<th style="width:88px">端口</th><th style="width:62px">协议</th><th style="width:110px">状态</th>'+
      '<th>服务识别</th><th>归属</th><th class="col-bind" style="width:130px">绑定</th>'+
      '<th class="col-use" style="width:150px">使用</th><th style="width:120px">风险</th>'+
      '</tr></thead><tbody>';
    rows.forEach(function(r, i){
      h += '<tr data-i="'+i+'">'+
        '<td><span class="port">'+r.port+'</span></td>'+
        '<td><span class="proto">'+esc(r.proto.toUpperCase())+'</span></td>'+
        '<td>'+stateHtml(r)+'</td>'+
        '<td><div class="svc"><span class="n">'+esc(r.service)+'</span>'+
          '<span class="d">'+esc(r.desc || r.comm || "")+'</span></div>'+miniHtml(r)+'</td>'+
        '<td><div class="owner"><span class="v">'+esc(r.app_label)+'</span>'+
          '<span class="k">'+esc(r.app_kind === "docker" ? (r.image||"容器") : (r.comm||""))+'</span></div></td>'+
        '<td class="col-bind">'+expHtml(r)+'</td>'+
        '<td class="col-use">'+usageHtml(r)+'</td>'+
        '<td>'+riskHtml(r)+'</td></tr>';
    });
    return h + '</tbody></table></div>';
  }

  function renderApps(rows){
    var map = {};
    rows.forEach(function(r){
      var key = r.app_label || "未归属";
      if(!map[key]) map[key] = {label:key, kind:r.app_kind, items:[]};
      map[key].items.push(r);
    });
    var groups = Object.keys(map).map(function(k){ return map[k]; });
    groups.sort(function(a,b){ return b.items.length - a.items.length; });
    if(!groups.length) return '<div class="empty">暂无数据</div>';
    var h = '<div class="appgrid">';
    groups.forEach(function(g){
      var maxRisk = Math.max.apply(null, g.items.map(function(r){ return r.risk; }));
      g.items.sort(function(a,b){ return a.port-b.port; });
      h += '<div class="appcard"><div class="h"><div><div class="t">'+esc(g.label)+'</div>'+
           '<div class="s">'+g.items.length+' 个端口 · '+
           (g.kind === "docker" ? "容器" : g.kind === "fnos" ? "飞牛应用" : g.kind === "system" ? "系统服务" : g.kind === "none" ? "幽灵端口 · 无监听" : "未归属")+
           '</div></div><span class="pill '+(maxRisk>=70?"high":maxRisk>=40?"mid":"low")+'">风险 '+maxRisk+'</span></div>'+
           '<div class="ports">';
      g.items.forEach(function(r){
        var cls = r.risk >= 70 ? "hi" : (r.risk >= 40 ? "mi" : "");
        h += '<span class="'+cls+'">'+r.port+'<span style="opacity:.45">/'+r.proto.charAt(0).toUpperCase()+'</span></span>';
      });
      h += '</div></div>';
    });
    return h + '</div>';
  }

  function renderConflicts(state){
    var rows = state.conflicts || [];
    if(!rows.length) return '<div class="empty"><div class="big">CLEAN</div>未检测到端口冲突</div>';
    var h = '<div class="list">';
    rows.forEach(function(c){
      var lv = c.level === "high" ? "high" : (c.level === "mid" ? "mid" : "info");
      h += '<div class="item"><span class="lv '+lv+'">'+esc(c.level.toUpperCase())+'</span>'+
           '<div class="body"><div class="t">'+esc(c.service)+' · <span class="mono">'+c.port+'/'+
           esc(c.proto.toUpperCase())+'</span></div><div class="d">'+esc(c.detail)+'</div></div>'+
           '<div class="ts mono">'+esc(c.code)+'</div></div>';
    });
    return h + '</div>';
  }

  function renderTimeline(events){
    if(!events || !events.length) return '<div class="empty"><div class="big">EMPTY</div>还没有变化记录</div>';
    var h = '<div class="list">';
    events.forEach(function(e){
      h += '<div class="item"><span class="lv info">'+esc(e.kind)+'</span>'+
           '<div class="body"><div class="t"><span class="mono">'+e.port+'/'+esc(e.proto.toUpperCase())+
           '</span> '+esc(e.detail)+'</div></div>'+
           '<div class="ts mono">'+fmtTime(e.ts)+'</div></div>';
    });
    return h + '</div>';
  }

  function render(){
    if(!S.data) return;
    var state = S.data;
    var ov = state.overview || {};
    var rows = state.ports || [];

    $("k-total").textContent = ov.listening != null ? ov.listening : "–";
    $("k-total-meta").textContent = "共 " + rows.length + " 条记录 · 采集 " + (ov.elapsed_ms||0) + " ms";
    $("k-high").textContent = ov.high != null ? ov.high : "–";
    $("k-high-meta").textContent = ov.public_v6 ? (ov.public_v6 + " 个公网 IPv6 可直连") : "暴露面评分 ≥ 70";
    $("k-idle").textContent = ov.idle != null ? ov.idle : "–";
    $("k-abn").textContent = ov.abnormal != null ? ov.abnormal : "–";
    $("k-abn-meta").textContent = (ov.dnat_error ? "流量数据不可用" : "僵尸 / 幽灵 / 冲突");

    var total = Math.max(rows.length, 1);
    $("k-total-bar").style.width = "100%";
    $("k-high-bar").style.width = Math.round((ov.high||0)/total*100) + "%";
    $("k-idle-bar").style.width = Math.round((ov.idle||0)/total*100) + "%";
    $("k-abn-bar").style.width = Math.round((ov.abnormal||0)/total*100) + "%";

    var abnormal = function(r){
      if(r.state === "ORPHAN" || r.state === "GHOST" || r.state === "GHOST_SOFT") return true;
      return (r.conflicts||[]).some(function(c){ return c.level === "high"; });
    };
    $("c-all").textContent = rows.length;
    $("c-active").textContent = rows.filter(function(r){ return r.state==="ACTIVE"||r.state==="WARM"; }).length;
    $("c-idle").textContent = rows.filter(function(r){ return r.state==="IDLE"; }).length;
    $("c-abn").textContent = rows.filter(abnormal).length;
    $("c-high").textContent = rows.filter(function(r){ return r.risk_level==="high"; }).length;

    var list = sorted(visible(rows));
    if(S.view === "matrix") $("view").innerHTML = renderMatrix(list);
    else if(S.view === "apps") $("view").innerHTML = renderApps(list);
    else if(S.view === "conflicts") $("view").innerHTML = renderConflicts(state);
    else $("view").innerHTML = renderTimeline(state.events || S.events || []);

    $("foot-right").textContent = "v" + (ov.version||"1.0.0") + " · 采集于 " + fmtTime(ov.ts) +
      " · 每 " + (ov.interval||10) + "s 刷新";
    $("scan-text").textContent = "已同步 " + fmtTime(ov.ts);
    $("scan-dot").className = "dot" + (ov.error ? " err" : (ov.degraded ? " warn" : ""));
  }

  /* -------------------------------- drawer -------------------------------- */
  var current = null;
  function openDrawer(r){
    current = r;
    $("d-port").textContent = r.port;
    $("d-meta").innerHTML = esc(r.service) + ' · ' + esc(r.proto.toUpperCase()) +
      ' · <span class="pill '+(r.risk_level)+'">风险 '+r.risk+'</span>';
    var h = "";
    h += '<div class="sec"><div class="h">判定依据</div><div class="kv">'+
      '<dt>状态</dt><dd>'+esc(r.state_label)+'</dd>'+
      '<dt>使用度</dt><dd>内 '+r.conns_in+' 条 / 外 '+r.conns_out+' 条连接'+
        (r.ext_packets ? ' · 外部流量 '+r.ext_packets+' 包' : '')+'</dd>'+
      '<dt>暴露面</dt><dd>'+esc(r.exposure_label)+'</dd>'+
      '<dt>绑定地址</dt><dd class="mono">'+esc((r.addrs||[]).join("  ") || "—")+'</dd>'+
      (r.mapped_to ? '<dt>端口映射</dt><dd class="mono">→ '+esc(r.mapped_to)+'</dd>' : '')+
      '</div></div>';

    h += '<div class="sec"><div class="h">归属链路</div><div class="kv">'+
      '<dt>应用</dt><dd>'+esc(r.app_label)+'</dd>'+
      ((r.owners && r.owners.length > 1) ? '<dt>共同持有</dt><dd>'+esc(r.owners.join("、"))+'</dd>' : '')+
      '<dt>进程</dt><dd class="mono">'+esc(r.comm || "—")+(r.pid?("  ·  PID "+r.pid):"")+'</dd>'+
      '<dt>可执行</dt><dd class="mono">'+esc(r.exe || "—")+'</dd>'+
      '<dt>cgroup</dt><dd class="mono">'+esc(r.cgroup || "—")+'</dd>'+
      (r.inner_proc ? '<dt>容器内</dt><dd class="mono">'+esc(r.inner_proc)+'  ← 已穿透确认</dd>' :
        (r.inner_verified ? '<dt>容器内</dt><dd>已确认监听 '+r.port+'（进程名不可读）</dd>' :
          (r.inner_ports && r.inner_ports.length ?
            '<dt>容器内</dt><dd class="mono">监听 '+esc(r.inner_ports.join(", "))+'（映射目标未命中）</dd>' : '')))+
      (r.container ? '<dt>容器</dt><dd class="mono">'+esc(r.container)+'</dd>' : '')+
      (r.image ? '<dt>镜像</dt><dd class="mono">'+esc(r.image)+'</dd>' : '')+
      '</div></div>';

    if(r.desc || r.advice){
      h += '<div class="sec"><div class="h">服务说明</div><div class="note">'+esc(r.desc||"")+
        (r.advice ? '<br><span style="color:#7f8c9b">建议：'+esc(r.advice)+'</span>' : '')+'</div></div>';
    }
    if((r.conflicts||[]).length){
      h += '<div class="sec"><div class="h">检测结果</div>';
      r.conflicts.forEach(function(c){
        h += '<div class="item" style="padding:8px 0"><span class="lv '+
          (c.level==="high"?"high":c.level==="mid"?"mid":"info")+'">'+esc(c.level)+'</span>'+
          '<div class="body"><div class="t">'+esc(c.code)+'</div><div class="d">'+esc(c.detail)+'</div></div></div>';
      });
      h += '</div>';
    }
    var ctl = r.control || { allowed:false, reason:"不可控制" };
    h += '<div class="sec"><div class="h">端口控制</div>';
    if(ctl.allowed){
      h += '<div class="note">控制对象：<b style="color:var(--text)">'+esc(ctl.label)+'</b>。'+
           '停止后该端口立即关闭，正在建立的连接会中断。</div>'+
           '<div class="actions"><button class="btn danger" id="act-stop">停止服务</button>'+
           '<button class="btn" id="act-start">启动服务</button></div>';
    }else{
      h += '<div class="note">'+esc(ctl.reason || "该端口未关联可控制的服务")+'</div>';
    }
    h += '</div>';

    h += '<div class="sec"><div class="h">标注</div>'+
      '<input id="note" placeholder="给这个端口写个备注" '+
      'style="width:100%;height:32px;border-radius:7px;border:1px solid var(--line);'+
      'background:rgba(0,0,0,.25);padding:0 10px;outline:none;color:var(--text)" value="'+esc(r.note||"")+'">'+
      '<div class="actions"><button class="btn primary" id="save-note">保存</button>'+
      '<button class="btn" id="accept">'+(r.accepted?"取消「已接受」":"标记为已接受")+'</button></div></div>';

    $("d-body").innerHTML = h;
    $("drawer").classList.add("on");
    $("scrim").classList.add("on");

    if(ctl.allowed){
      $("act-stop").addEventListener("click", function(){ askAction(r, "stop"); });
      $("act-start").addEventListener("click", function(){ askAction(r, "start"); });
    }

    $("save-note").addEventListener("click", function(){ saveLabel(r, $("note").value, r.accepted); });
    $("accept").addEventListener("click", function(){ saveLabel(r, $("note").value, !r.accepted); });
  }
  function closeDrawer(){
    $("drawer").classList.remove("on");
    $("scrim").classList.remove("on");
    current = null;
  }
  function confirmAction(title, text, okLabel, onOk){
    $("m-title").textContent = title;
    $("m-text").textContent = text;
    $("m-ok").textContent = okLabel;
    $("modal").classList.add("on");
    $("m-cancel").onclick = function(){ $("modal").classList.remove("on"); };
    $("m-ok").onclick = function(){
      $("modal").classList.remove("on");
      onOk();
    };
  }

  function askAction(r, action){
    var ctl = r.control || {};
    var isStop = action === "stop";
    var target = ctl.label || ("端口 " + r.port);
    confirmAction(
      (isStop ? "停止 " : "启动 ") + r.service,
      "将" + (isStop ? "停止" : "启动") + " " + target + "（端口 " + r.port + "/" +
        r.proto.toUpperCase() + "）。" +
        (isStop ? "停止后端口关闭，正在建立的连接会断开。" : "启动后端口重新开始监听。"),
      isStop ? "停止" : "启动",
      function(){ doAction(r, action); }
    );
  }

  function doAction(r, action){
    api("api/action", {
      method: "POST",
      body: JSON.stringify({ port: r.port, proto: r.proto, action: action, confirm: action })
    }).then(function(res){
      toast(res.message || "已执行");
      closeDrawer();
      return load();
    }).catch(function(e){
      toast(e.message || "执行失败");
    });
  }

  function saveLabel(r, note, accepted){
    api("api/label", { method:"POST", body: JSON.stringify({port:r.port, proto:r.proto, note:note, accepted:accepted}) })
      .then(function(){ toast("已保存"); return load(); })
      .then(function(){ if(current){ var f = (S.data.ports||[]).filter(function(x){
        return x.port===r.port && x.proto===r.proto; })[0]; if(f) openDrawer(f); } })
      .catch(function(e){ toast(e.message); });
  }

  /* -------------------------------- data -------------------------------- */
  function load(){
    return api("api/ports").then(function(d){
      S.data = d;
      return api("api/timeline?limit=120").then(function(t){ S.events = t.events || []; })
        .catch(function(){ S.events = []; })
        .then(function(){ render(); });
    }).catch(function(e){
      if(e.status === 401){ showGate(false); throw e; }
      $("scan-dot").className = "dot err";
      $("scan-text").textContent = "采集异常";
      throw e;
    });
  }

  function schedule(){
    if(S.timer) clearInterval(S.timer);
    var iv = Math.max(10, (S.data && S.data.overview && S.data.overview.interval) || 10);
    S.timer = setInterval(function(){
      if(document.hidden) return;
      $("scan-dot").classList.add("pulse");
      load().then(function(){ $("scan-dot").classList.remove("pulse"); })
            .catch(function(){ $("scan-dot").classList.remove("pulse"); });
    }, iv*1000);
  }

  function boot(){
    var wantPort = 0;
    try{
      var params = new URLSearchParams(location.search);
      var v = params.get("view");
      if(v && ["matrix","apps","conflicts","timeline"].indexOf(v) >= 0){
        S.view = v;
        [].forEach.call($("tabs").children, function(x){
          x.classList.toggle("on", x.dataset.view === v);
        });
      }
      wantPort = parseInt(params.get("port") || "0", 10) || 0;
    }catch(e){}
    load().then(function(){
      schedule();
      if(wantPort){
        var rec = (S.data.ports || []).filter(function(x){ return x.port === wantPort; })[0];
        if(rec) openDrawer(rec);
      }
    }).catch(function(){});
  }

  /* -------------------------------- events -------------------------------- */
  $("tabs").addEventListener("click", function(e){
    var b = e.target.closest(".tab"); if(!b) return;
    S.view = b.dataset.view;
    [].forEach.call(this.children, function(x){ x.classList.toggle("on", x === b); });
    render();
  });
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    S.filter = b.dataset.f;
    [].forEach.call(this.children, function(x){ x.classList.toggle("on", x === b); });
    render();
  });
  $("q").addEventListener("input", function(){ S.q = this.value; render(); });
  $("sort").addEventListener("change", function(){ S.sort = this.value; render(); });
  $("view").addEventListener("click", function(e){
    var tr = e.target.closest("tr[data-i]"); if(!tr) return;
    var list = sorted(visible(S.data.ports || []));
    var r = list[parseInt(tr.dataset.i, 10)];
    if(r) openDrawer(r);
  });
  $("d-close").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeDrawer(); });

  $("btn-refresh").addEventListener("click", function(){
    $("scan-dot").classList.add("pulse");
    api("api/refresh", {method:"POST"}).then(load).then(function(){
      $("scan-dot").classList.remove("pulse"); toast("已刷新");
    }).catch(function(e){ toast(e.message); });
  });
  $("btn-export").addEventListener("click", function(e){
    var menu = document.createElement("div");
    menu.style.cssText = "position:fixed;z-index:95;background:#0d131a;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px;min-width:150px;box-shadow:0 12px 30px rgba(0,0,0,.5)";
    var r = this.getBoundingClientRect();
    menu.style.top = (r.bottom+8)+"px"; menu.style.right = "24px";
    [["markdown","Markdown 报告"],["csv","CSV 表格"],["json","JSON 数据"]].forEach(function(it){
      var a = document.createElement("a");
      a.href = "api/export?format="+it[0];
      a.textContent = it[1];
      a.style.cssText = "display:block;padding:8px 11px;border-radius:6px;color:#aab6c4;text-decoration:none;font-size:12px";
      a.onmouseenter = function(){ a.style.background="rgba(255,255,255,.05)"; a.style.color="#e8eef6"; };
      a.onmouseleave = function(){ a.style.background="none"; a.style.color="#aab6c4"; };
      menu.appendChild(a);
    });
    document.body.appendChild(menu);
    setTimeout(function(){
      document.addEventListener("click", function close(){ menu.remove(); document.removeEventListener("click", close); });
    }, 0);
  });
  $("btn-logout").addEventListener("click", function(){
    api("api/logout", {method:"POST"}).then(function(){ location.reload(); });
  });

  /* -------------------------------- init -------------------------------- */
  api("api/session").then(function(s){
    if(!s.authed){ showGate(s.needs_setup); return; }
    hideGate(); boot();
  }).catch(function(){ showGate(false); });
})();
</script>
</body>
</html>
